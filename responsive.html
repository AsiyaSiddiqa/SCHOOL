<!DOCTYPE html>
<html>
<head>
    <title>Header</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <header class="bg-blue-950 text-white flex flex-col md:flex-row justify-between items-center w-full overflow-hidden">
            <div class="flex items-center space-x-3 px-4 py-3 w-full md:w-auto justify-center md:justify-start">
        <img src="Asia/clrbg.png" class="w-[60px] h-[60px] sm:w-[80px] sm:h-[80px] object-contain rounded-full flex-shrink-0" />
        <div class="text-center md:text-left">

          <p class="text-xs sm:text-sm text-amber-400 font-semibold">Mianwal Ranjha</p>
        </div>
      </div>
      <div class="hidden lg:flex items-center justify-end pr-6 pl-12 h-full py-5 bg-amber-400 text-black font-bold text-sm [clip-path:polygon(12%_0,_100%_0,_100%_100%,_0%_100%)]">

        <span>Principal: Ms Farwa Nawaz (SST IT)</span>
      </div>
