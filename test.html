<html>
    <head>
        <title>
            Animation
        </title>
        <style>
            .box-container{
                height:600px;
                width: 600px;
                border:2px black solid;
                margin:auto;
                margin-top: 30px;
                position: relative;
            }
            .box{
                height:200px;
                width:200px;
                background-color: red;
                position: absolute;
                top:0px;
                left:0px;
                animation-name: book;
                animation-duration: 5s;
                animation-delay: 2s;
                animation-iteration-count: 2;
                animation-direction: alternate;
                animation-fill-mode: forwards;
            }
            @keyframes book{
                0%{
                    top:0px;
                    left:0px;
                    background-color: red;
                }
                10%{
                    top:0px;
                    left:400px;
                    background-color: blue;
                }
                50%{
                    top:400px;
                    left:400px;
                    background-color: yellow;
                }
                60%{
                    top:400px;
                    left:0px;
                    background-color: rgb(5, 100, 49);
                }
                0%{
                    top:0px;
                    left:0px;
                    background-color: red;
                }
                

            }
        </style>
    </head>
    <body>
        <div class="box-container">
            <div class="box">

            </div>
        </div>
    </body>
</html>
